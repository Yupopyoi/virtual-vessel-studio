name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Application
        - Project / Data
        - Avatar
        - Tracking
        - Voice
        - Audio
        - Capture
        - Stage
        - Video
        - Streaming
        - Voice Lab
        - External Services
        - Diagnostics
        - UI
        - Unknown

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
