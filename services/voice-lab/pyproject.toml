[project]
name = "voice-lab-rvc"
version = "0.0.1"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.7.1+cu118",
  "torchaudio==2.7.1+cu118",
  "numpy==1.26.4",
  "scipy==1.17.1",
  "librosa==0.10.2.post1",
  "soundfile==0.14.0",
  "av==15.1.0",
  "ffmpeg-python==0.2.0",
  "matplotlib==3.11.2",
  "tensorboard==2.21.0",
  "transformers==4.49.0",
  "onnx==1.23.2",
  "setuptools<81",
  # Voice design (Voice Lab detailed design 8.3): VoxCPM2 for candidates and training speech, WORLD for timbre.
  "voxcpm==2.0.3",
  "einops==0.8.2",
  "pydantic==2.14.2",
  "pyworld==0.3.5",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

# voxcpm declares training, denoising, and UI packages its inference never imports; funasr among them pulls in
# kaldiio, whose license allows evaluation only. Only what inference imports is kept (decision record, 2026-11-03).
[[tool.uv.dependency-metadata]]
name = "voxcpm"
version = "2.0.3"
requires-dist = [
  "torch>=2.5.0",
  "torchaudio>=2.5.0",
  "transformers>=4.36.2",
  "einops",
  "huggingface-hub",
  "pydantic",
  "tqdm",
  "soundfile",
  "librosa",
  "safetensors",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
